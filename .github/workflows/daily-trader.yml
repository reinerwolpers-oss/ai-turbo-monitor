
name: AI Daily Trader signals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trader.py'
      - 'test_trader.py'
      - 'requirements.txt'
      - '.github/workflows/daily-trader.yml'
  schedule:
    # Werktags 21:15 UTC, nach US-Boersenschluss
    - cron: '15 21 * * 1-5'

permissions:
  contents: read

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Kursvalidierung testen
        run: python -m unittest -v test_trader

      - name: Kursabruf für den betroffenen Handelstag prüfen
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from datetime import date
          from trader import SYMBOLS, calculate

          session = date(2026, 11, 19)
          failures = []
          for symbol in SYMBOLS:
              try:
                  result = calculate(symbol, session)
                  assert result['last_data_date'] == session.isoformat()
              except Exception as exc:
                  print(f'{symbol}: {exc}')
                  failures.append(symbol)
              else:
                  print(f'{symbol}: gültiger Tageskurs für {session}')
          print(f'{len(SYMBOLS) - len(failures)}/{len(SYMBOLS)} Symbole erfolgreich')
          if failures:
              raise SystemExit(1)
          PY

      - name: Aktien analysieren
        if: github.event_name != 'pull_request'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          SYMBOLS: NVDA,AMD,MSFT,TSLA,AAPL,SPCX,TTWO
          SEND_NO_SIGNALS: 'true'
        run: python trader.py

      - name: Ergebnisse speichern
        uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: signals-${{ github.run_number }}
          path: output/latest.json
          if-no-files-found: ignore
          retention-days: 30
