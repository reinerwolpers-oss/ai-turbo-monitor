
name: AI Daily Trader signals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trader.py'
      - 'test_trader.py'
      - 'requirements.txt'
      - '.github/workflows/daily-trader.yml'
  schedule:
    # Werktags 21:15 UTC, nach US-Boersenschluss
    - cron: '15 21 * * 1-5'

permissions:
  contents: read

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Kursvalidierung testen
        run: python -m unittest -v test_trader

      - name: Vorhandene Kurse und Ausfall einzelner Symbole prüfen
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import contextlib
          import io
          import json
          from datetime import date, timedelta
          from pathlib import Path
          from unittest.mock import patch

          import pandas as pd
          import trader

          session = date(2026, 11, 19)
          with (
              patch.object(trader, 'completed_session_today', return_value=session),
              patch.object(trader, 'send_push') as push,
              contextlib.redirect_stdout(io.StringIO()),
          ):
              trader.main()

          report = json.loads(Path('output/latest.json').read_text())
          expected = set(trader.SYMBOLS) - {'SPCX'}
          actual = {row['symbol'] for row in report['results']}
          assert expected <= actual, report['errors']
          assert all(row['last_data_date'] == session.isoformat() for row in report['results'])
          assert report['mode'] == 'SIGNALS_ONLY_NO_REAL_ORDERS'
          if 'SPCX' not in actual:
              assert any(error.startswith('SPCX:') for error in report['errors'])
              assert 'FEHLER: SPCX:' in push.call_args.args[0]
          print(f"{len(actual)}/{len(trader.SYMBOLS)} Ergebnisse; Fehler: {report['errors']}")
          print(f"{sum(row['signal'] != 'KEIN HANDELSSIGNAL' for row in report['results'])} Signale")

          for label, params in [
              ('standard', {'period': '6mo', 'auto_adjust': True}),
              ('raw', {'period': '6mo', 'auto_adjust': False}),
              ('date range', {'start': (session - timedelta(days=180)).isoformat(),
                              'end': (session + timedelta(days=1)).isoformat(),
                              'auto_adjust': True}),
          ]:
              try:
                  data = trader.yf.Ticker('SPCX').history(interval='1d', **params)
                  rows = data.loc[data.index.date == session]
                  print(f'SPCX {label}: {len(rows)} Zeilen am Stichtag')
                  for column in ('Close', 'Adj Close'):
                      if column in rows:
                          print(f'  {column}: {rows[column].notna().sum()} gültige Einträge')
              except Exception as exc:
                  print(f'SPCX {label}: {exc}')
          PY

      - name: Aktien analysieren
        if: github.event_name != 'pull_request'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          SYMBOLS: NVDA,AMD,MSFT,TSLA,AAPL,SPCX,TTWO
          SEND_NO_SIGNALS: 'true'
        run: python trader.py

      - name: Ergebnisse speichern
        uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: signals-${{ github.run_number }}
          path: output/latest.json
          if-no-files-found: ignore
          retention-days: 30
