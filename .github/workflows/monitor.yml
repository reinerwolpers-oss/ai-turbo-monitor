
name: AI Turbo Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: ai-turbo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Kurse und Risiken prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          KNOCKOUT_USD: ${{ vars.KNOCKOUT_USD }}
          WARN_PCT: ${{ vars.WARN_PCT }}
          CRITICAL_PCT: ${{ vars.CRITICAL_PCT }}
        run: python monitor.py

      - name: Kursdaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update market data"
            git push
          fi
